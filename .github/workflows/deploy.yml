name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy (edge, 0.5.0, or sha-...)
        required: true
        default: edge
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://relohelper.pro
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Deploy workflow must be run from the main branch."
            exit 1
          fi

          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "VPS_HOST must be an IPv4 address or DNS name."
            exit 1
          }
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "VPS_PORT must be a valid port number."
            exit 1
          }
          (( 10#$VPS_PORT >= 1 && 10#$VPS_PORT <= 65535 )) || {
            echo "VPS_PORT must be between 1 and 65535."
            exit 1
          }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || {
            echo "VPS_USER contains unsupported characters."
            exit 1
          }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "VPS_DEPLOY_PATH must be an absolute path without spaces."
            exit 1
          }
          [[ -n "$SSH_PRIVATE_KEY" ]] || {
            echo "VPS_SSH_PRIVATE_KEY is not configured."
            exit 1
          }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "VPS_SSH_KNOWN_HOSTS is not configured."
            exit 1
          }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy image
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$IMAGE_TAG' '$VPS_DEPLOY_PATH'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          image_tag=$1
          deploy_path=$2
          image="ghcr.io/denis-k2/relohelper-go:${image_tag}"

          cd "$deploy_path"

          if [[ ! -f .env ]]; then
            echo "Missing $deploy_path/.env"
            exit 1
          fi

          if [[ "$(git branch --show-current)" != "main" ]]; then
            echo "The VPS repository must be on the main branch."
            exit 1
          fi

          git pull --ff-only origin main
          docker pull "$image"

          if grep -q '^RELOHELPER_IMAGE_TAG=' .env; then
            sed -i "s/^RELOHELPER_IMAGE_TAG=.*/RELOHELPER_IMAGE_TAG=${image_tag}/" .env
          else
            printf '\nRELOHELPER_IMAGE_TAG=%s\n' "$image_tag" >> .env
          fi

          compose=(
            docker compose
            --env-file .env
            -f deploy/docker-compose.yml
          )

          "${compose[@]}" pull api

          if ! "${compose[@]}" up -d --remove-orphans; then
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=100 api migrate
            exit 1
          fi

          ready=false
          for _ in $(seq 1 30); do
            if "${compose[@]}" exec -T api \
              wget -qO- http://127.0.0.1:4000/readyz >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "API readiness check failed."
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=100 api migrate
            exit 1
          fi

          "${compose[@]}" exec -T api /app/api -version
          "${compose[@]}" ps
          REMOTE_SCRIPT

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "### Production deployment completed"
            echo
            echo "- Image: \`ghcr.io/denis-k2/relohelper-go:$IMAGE_TAG\`"
            echo "- Environment: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
