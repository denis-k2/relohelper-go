name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RELOHELPER_TEST_DB_DSN: postgres://relohelper_test:relohelper_test@localhost:5432/relohelper_test?sslmode=disable

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: relohelper_test
          POSTGRES_USER: relohelper_test
          POSTGRES_PASSWORD: relohelper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relohelper_test -d relohelper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: "1.31.1"

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Install test and analysis tools
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          go install golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.22.0

      - name: Prepare test database
        run: make db/test/prepare

      - name: Run quality checks
        run: make audit

      - name: Build API
        run: go build ./cmd/api
