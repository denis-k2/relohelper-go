services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:18
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]

  api:
    image: ghcr.io/denis-k2/relohelper-go:${RELOHELPER_IMAGE_TAG:-edge}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      RELOHELPER_ENV: production
      RELOHELPER_PORT: 4000
      RELOHELPER_DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RELOHELPER_DB_MAX_OPEN_CONNS: ${RELOHELPER_DB_MAX_OPEN_CONNS:-25}
      RELOHELPER_DB_MAX_IDLE_TIME: ${RELOHELPER_DB_MAX_IDLE_TIME:-15m}
      RELOHELPER_LIMITER_RPS: ${RELOHELPER_LIMITER_RPS:-10}
      RELOHELPER_LIMITER_BURST: ${RELOHELPER_LIMITER_BURST:-20}
      RELOHELPER_LIMITER_ENABLED: ${RELOHELPER_LIMITER_ENABLED:-true}
      RELOHELPER_AUTH_ENABLED: ${RELOHELPER_AUTH_ENABLED:-true}
      RELOHELPER_METRICS_PORT: 4001
      RELOHELPER_BATCH_MAX_IDS: ${RELOHELPER_BATCH_MAX_IDS:-100}
      RELOHELPER_BATCH_MAX_DETAILED_IDS: ${RELOHELPER_BATCH_MAX_DETAILED_IDS:-20}
      RELOHELPER_EXCHANGE_RATES_APP_ID: ${RELOHELPER_EXCHANGE_RATES_APP_ID:-}
      RELOHELPER_SMTP_HOST: ${RELOHELPER_SMTP_HOST:-}
      RELOHELPER_SMTP_PORT: ${RELOHELPER_SMTP_PORT:-25}
      RELOHELPER_SMTP_USERNAME: ${RELOHELPER_SMTP_USERNAME:-}
      RELOHELPER_SMTP_PASSWORD: ${RELOHELPER_SMTP_PASSWORD:-}
      RELOHELPER_SMTP_SENDER: ${RELOHELPER_SMTP_SENDER:-Relohelper <no-reply@relohelper.local>}
    # Keep CLI overrides through v0.6.0 so the stack can roll back to v0.5.0.
    command:
      [
        "/app/api",
        "-env=production",
        "-port=4000",
        "-db-max-open-conns=${RELOHELPER_DB_MAX_OPEN_CONNS:-25}",
        "-db-max-idle-time=${RELOHELPER_DB_MAX_IDLE_TIME:-15m}",
        "-limiter-rps=${RELOHELPER_LIMITER_RPS:-10}",
        "-limiter-burst=${RELOHELPER_LIMITER_BURST:-20}",
        "-limiter-enabled=${RELOHELPER_LIMITER_ENABLED:-true}",
        "-auth-enabled=${RELOHELPER_AUTH_ENABLED:-true}",
        "-metrics-port=4001",
        "-batch-max-ids=${RELOHELPER_BATCH_MAX_IDS:-100}",
        "-batch-max-detailed-ids=${RELOHELPER_BATCH_MAX_DETAILED_IDS:-20}",
        "-smtp-port=${RELOHELPER_SMTP_PORT:-25}",
      ]
    expose:
      - "4000"
      - "4001"

  prometheus:
    image: prom/prometheus:v3.10.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ../monitoring/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data:
